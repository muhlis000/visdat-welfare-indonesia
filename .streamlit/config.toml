[theme]
base = "light"
primaryColor = "#0f5c6c"
backgroundColor = "#faf8f5"
secondaryBackgroundColor = "#efeae2"
textColor = "#1c1917"
linkColor = "#0f5c6c"
borderColor = "#d6cfc4"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&display=swap"
baseFontSize = 16
headingFontSizes = ["40px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#0f5c6c", "#b45309", "#7c3aed", "#be123c", "#15803d", "#1d4ed8", "#a16207"]
chartSequentialColors = ["#faf8f5", "#fde68a", "#fbbf24", "#f59e0b", "#d97706", "#b45309", "#9a3412", "#7c2d12", "#5c1a0a", "#3b0f07"]
redColor = "#be123c"
orangeColor = "#c2410c"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#0f5c6c"
violetColor = "#7c3aed"
grayColor = "#57534e"

[theme.sidebar]
backgroundColor = "#f3efe8"
secondaryBackgroundColor = "#e7e0d6"
